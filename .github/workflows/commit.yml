name: Smoke test

# Runs `crd2proto generate` against every bundled example project and then
# validates the emitted .proto with protoc (the Makefile `run-*` targets do
# both). Each example runs as its own matrix job so a failure in one is
# isolated. 

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: guestbook
            target: run-guestbook
          - example: gateway-api
            target: run-gateway
          - example: cert-manager
            target: run-cert-manager
          - example: kubevirt
            target: run-kubevirt
          - example: flux-source
            target: run-flux-source
          - example: flux-kustomize
            target: run-flux-kustomize
          - example: flux-helm
            target: run-flux-helm
          - example: crossplane
            target: run-crossplane
          - example: kyverno
            target: run-kyverno

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate and validate ${{ matrix.example }}
        run: make ${{ matrix.target }}
